# Checks that run before each commit. Install them once per clone:
#   uv run pre-commit install
# They use the tools uv installs, so nothing is downloaded. CI runs the same checks.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: commit-message
        name: commit message
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
