<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="720" height="296" role="img"><title>How Cliquet works</title><style>
svg{--bg:oklch(99.5% .004 85);--surface:#fff;--line:oklch(88% .015 85);
--ink:oklch(23% .02 285);--muted:oklch(48% .02 285);--p:oklch(50% .2 285);
--ok:oklch(55% .14 155);--no:oklch(56% .2 25);--a:oklch(70% .16 55);--b:oklch(72% .14 175)}
@media (prefers-color-scheme:dark){svg{--bg:oklch(17% .015 285);--surface:oklch(21% .018 285);
--line:oklch(31% .02 285);--ink:oklch(93% .01 285);--muted:oklch(72% .02 285);
--p:oklch(74% .14 285);--ok:oklch(72% .14 155);--no:oklch(70% .17 25)}}
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.25}
.app{fill:color-mix(in srgb,var(--p) 5%,var(--bg));
stroke:color-mix(in srgb,var(--p) 40%,var(--line));stroke-width:1.25;stroke-dasharray:5 4}
.t{fill:var(--ink);font-size:15px;font-weight:650}
.s{fill:var(--muted);font-size:13px}
.lbl{fill:var(--p);font-size:11px;font-weight:700;letter-spacing:.08em}
.icbg{fill:color-mix(in srgb,var(--p) 12%,var(--surface))}
.ic{fill:none;stroke:var(--p);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ln{fill:none;stroke:color-mix(in srgb,var(--p) 55%,var(--line));stroke-width:1.5}
.hd{fill:color-mix(in srgb,var(--p) 55%,var(--line))}
.pill{fill:var(--surface);stroke:color-mix(in srgb,var(--no) 45%,var(--line))}
.pt{fill:var(--no);font-size:12px;font-weight:650;text-anchor:middle}
.okn{fill:color-mix(in srgb,var(--ok) 7%,var(--surface));
stroke:color-mix(in srgb,var(--ok) 55%,var(--line));stroke-width:1.25}
.non{fill:color-mix(in srgb,var(--no) 6%,var(--surface));
stroke:color-mix(in srgb,var(--no) 50%,var(--line));stroke-width:1.25}
.okb{fill:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.okc{stroke:var(--ok)}
.nob{fill:color-mix(in srgb,var(--no) 14%,var(--surface))}
.noc{stroke:var(--no)}
.fa{fill:color-mix(in srgb,var(--a) 50%,var(--surface));stroke:var(--surface);stroke-width:2}
.fb{fill:color-mix(in srgb,var(--b) 50%,var(--surface));stroke:var(--surface);stroke-width:2}
.ft{fill:var(--ink);font-size:10px;font-weight:700;text-anchor:middle}
.dot{fill:var(--surface);stroke:var(--p);stroke-width:2.5}
.undo{fill:none;stroke:var(--no);stroke-width:1.5;stroke-dasharray:4 4}
</style><defs><symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol><symbol id="bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v1M15 13v1"/></symbol><symbol id="phone" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol><symbol id="shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol><symbol id="sheet" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></symbol><symbol id="pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></symbol><symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></symbol><symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol><symbol id="key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></symbol><symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol><symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd" d="M0 0L10 5L0 10z"/></marker></defs><rect class="node" x="0" y="92" width="140" height="110" rx="12"/><circle class="icbg" cx="30" cy="122" r="15"/><use class="ic " href="#user" x="21.75" y="113.75" width="16.5" height="16.5"/><text class="t" x="54" y="127">You</text><text class="s" x="16" y="160">describe what</text><text class="s" x="16" y="178">you need</text><path class="ln" d="M140 147H168" marker-end="url(#hd)"/><rect class="node" x="170" y="92" width="150" height="110" rx="12"/><circle class="icbg" cx="200" cy="122" r="15"/><use class="ic " href="#bot" x="191.75" y="113.75" width="16.5" height="16.5"/><text class="t" x="224" y="127">Assistant</text><text class="s" x="186" y="160">Claude, ChatGPT…</text><text class="s" x="186" y="178">builds and uses it</text><path class="ln" d="M320 147H348" marker-end="url(#hd)"/><rect class="app" x="350" y="0" width="210" height="294" rx="16"/><text class="lbl" x="366" y="24">YOUR CLIQUET APP</text><rect class="node" x="362" y="38" width="186" height="70" rx="10"/><circle class="icbg" cx="390" cy="73" r="14"/><use class="ic " href="#sheet" x="382.3" y="65.3" width="15.400000000000002" height="15.400000000000002"/><text class="t" x="414" y="68">Data</text><text class="s" x="414" y="88">every change saved</text><rect class="node" x="362" y="122" width="186" height="70" rx="10"/><circle class="icbg" cx="390" cy="157" r="14"/><use class="ic " href="#shield" x="382.3" y="149.3" width="15.400000000000002" height="15.400000000000002"/><text class="t" x="414" y="152">Rules</text><text class="s" x="414" y="172">always hold</text><rect class="node" x="362" y="206" width="186" height="70" rx="10"/><circle class="icbg" cx="390" cy="241" r="14"/><use class="ic " href="#phone" x="382.3" y="233.3" width="15.400000000000002" height="15.400000000000002"/><text class="t" x="414" y="236">Screens</text><text class="s" x="414" y="256">for your team</text><path class="ln" d="M548 245H588" marker-end="url(#hd)"/><rect class="node" x="590" y="190" width="130" height="104" rx="12"/><circle class="fa" cx="614" cy="220" r="11"/><circle class="fb" cx="629" cy="220" r="11"/><text class="ft" x="614" y="223.5">S</text><text class="ft" x="629" y="223.5">A</text><text class="t" x="644" y="225">Team</text><text class="s" x="606" y="258">on a phone or</text><text class="s" x="606" y="276">in a browser</text></svg>
