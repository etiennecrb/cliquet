<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 408" width="360" height="408" role="img"><title>Roles in an app</title><style>
svg{--bg:oklch(99.5% .004 85);--surface:#fff;--line:oklch(88% .015 85);
--ink:oklch(23% .02 285);--muted:oklch(48% .02 285);--p:oklch(50% .2 285);
--ok:oklch(55% .14 155);--no:oklch(56% .2 25);--a:oklch(70% .16 55);--b:oklch(72% .14 175)}
@media (prefers-color-scheme:dark){svg{--bg:oklch(17% .015 285);--surface:oklch(21% .018 285);
--line:oklch(31% .02 285);--ink:oklch(93% .01 285);--muted:oklch(72% .02 285);
--p:oklch(74% .14 285);--ok:oklch(72% .14 155);--no:oklch(70% .17 25)}}
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.25}
.app{fill:color-mix(in srgb,var(--p) 5%,var(--bg));
stroke:color-mix(in srgb,var(--p) 40%,var(--line));stroke-width:1.25;stroke-dasharray:5 4}
.t{fill:var(--ink);font-size:15px;font-weight:650}
.s{fill:var(--muted);font-size:13px}
.lbl{fill:var(--p);font-size:11px;font-weight:700;letter-spacing:.08em}
.icbg{fill:color-mix(in srgb,var(--p) 12%,var(--surface))}
.ic{fill:none;stroke:var(--p);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ln{fill:none;stroke:color-mix(in srgb,var(--p) 55%,var(--line));stroke-width:1.5}
.hd{fill:color-mix(in srgb,var(--p) 55%,var(--line))}
.pill{fill:var(--surface);stroke:color-mix(in srgb,var(--no) 45%,var(--line))}
.pt{fill:var(--no);font-size:12px;font-weight:650;text-anchor:middle}
.okn{fill:color-mix(in srgb,var(--ok) 7%,var(--surface));
stroke:color-mix(in srgb,var(--ok) 55%,var(--line));stroke-width:1.25}
.non{fill:color-mix(in srgb,var(--no) 6%,var(--surface));
stroke:color-mix(in srgb,var(--no) 50%,var(--line));stroke-width:1.25}
.okb{fill:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.okc{stroke:var(--ok)}
.nob{fill:color-mix(in srgb,var(--no) 14%,var(--surface))}
.noc{stroke:var(--no)}
.fa{fill:color-mix(in srgb,var(--a) 50%,var(--surface));stroke:var(--surface);stroke-width:2}
.fb{fill:color-mix(in srgb,var(--b) 50%,var(--surface));stroke:var(--surface);stroke-width:2}
.ft{fill:var(--ink);font-size:10px;font-weight:700;text-anchor:middle}
.dot{fill:var(--surface);stroke:var(--p);stroke-width:2.5}
.undo{fill:none;stroke:var(--no);stroke-width:1.5;stroke-dasharray:4 4}
</style><defs><symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol><symbol id="bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v1M15 13v1"/></symbol><symbol id="phone" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol><symbol id="shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol><symbol id="sheet" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></symbol><symbol id="pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></symbol><symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></symbol><symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol><symbol id="key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></symbol><symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol><symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd" d="M0 0L10 5L0 10z"/></marker></defs><rect class="app" x="40" y="0" width="280" height="140" rx="16"/><text class="lbl" x="180.0" y="28" text-anchor="middle">MEETING ROOMS</text><circle class="icbg" cx="180.0" cy="72.0" r="22"/><use class="ic " href="#calendar" x="167.9" y="59.9" width="24.200000000000003" height="24.200000000000003"/><text class="s" x="180.0" y="122" text-anchor="middle">rooms and bookings</text><path class="ln" d="M180 140V156M88 156H272M88 156V170M272 156V170"/><rect class="node" x="0" y="170" width="175" height="112" rx="12"/><circle class="icbg" cx="30" cy="200" r="15"/><use class="ic " href="#user" x="21.75" y="191.75" width="16.5" height="16.5"/><text class="t" x="54" y="205">Owner</text><text class="s" x="16" y="238">Sam: everything,</text><text class="s" x="16" y="256">and shares the app</text><rect class="node" x="185" y="170" width="175" height="112" rx="12"/><circle class="icbg" cx="215" cy="200" r="15"/><use class="ic " href="#calendar" x="206.75" y="191.75" width="16.5" height="16.5"/><text class="t" x="239" y="205">Members</text><text class="s" x="201" y="238">book rooms, move</text><text class="s" x="201" y="256">their own bookings</text><rect class="node" x="0" y="294" width="175" height="112" rx="12"/><circle class="icbg" cx="30" cy="324" r="15"/><use class="ic " href="#key" x="21.75" y="315.75" width="16.5" height="16.5"/><text class="t" x="54" y="329">A routine</text><text class="s" x="16" y="362">a token for this app,</text><text class="s" x="16" y="380">as member</text><rect class="node" x="185" y="294" width="175" height="112" rx="12"/><circle class="icbg" cx="215" cy="324" r="15"/><use class="ic " href="#lock" x="206.75" y="315.75" width="16.5" height="16.5"/><text class="t" x="239" y="329">Everyone else</text><text class="s" x="201" y="362">can't open the app</text><text class="s" x="201" y="380">until you share it</text></svg>
