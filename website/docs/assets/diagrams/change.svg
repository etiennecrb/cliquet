<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" width="720" height="232" role="img"><title>What happens when something changes</title><style>
svg{--bg:oklch(99.5% .004 85);--surface:#fff;--line:oklch(88% .015 85);
--ink:oklch(23% .02 285);--muted:oklch(48% .02 285);--p:oklch(50% .2 285);
--ok:oklch(55% .14 155);--no:oklch(56% .2 25);--a:oklch(70% .16 55);--b:oklch(72% .14 175)}
@media (prefers-color-scheme:dark){svg{--bg:oklch(17% .015 285);--surface:oklch(21% .018 285);
--line:oklch(31% .02 285);--ink:oklch(93% .01 285);--muted:oklch(72% .02 285);
--p:oklch(74% .14 285);--ok:oklch(72% .14 155);--no:oklch(70% .17 25)}}
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.25}
.app{fill:color-mix(in srgb,var(--p) 5%,var(--bg));
stroke:color-mix(in srgb,var(--p) 40%,var(--line));stroke-width:1.25;stroke-dasharray:5 4}
.t{fill:var(--ink);font-size:15px;font-weight:650}
.s{fill:var(--muted);font-size:13px}
.lbl{fill:var(--p);font-size:11px;font-weight:700;letter-spacing:.08em}
.icbg{fill:color-mix(in srgb,var(--p) 12%,var(--surface))}
.ic{fill:none;stroke:var(--p);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ln{fill:none;stroke:color-mix(in srgb,var(--p) 55%,var(--line));stroke-width:1.5}
.hd{fill:color-mix(in srgb,var(--p) 55%,var(--line))}
.pill{fill:var(--surface);stroke:color-mix(in srgb,var(--no) 45%,var(--line))}
.pt{fill:var(--no);font-size:12px;font-weight:650;text-anchor:middle}
.okn{fill:color-mix(in srgb,var(--ok) 7%,var(--surface));
stroke:color-mix(in srgb,var(--ok) 55%,var(--line));stroke-width:1.25}
.non{fill:color-mix(in srgb,var(--no) 6%,var(--surface));
stroke:color-mix(in srgb,var(--no) 50%,var(--line));stroke-width:1.25}
.okb{fill:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.okc{stroke:var(--ok)}
.nob{fill:color-mix(in srgb,var(--no) 14%,var(--surface))}
.noc{stroke:var(--no)}
.fa{fill:color-mix(in srgb,var(--a) 50%,var(--surface));stroke:var(--surface);stroke-width:2}
.fb{fill:color-mix(in srgb,var(--b) 50%,var(--surface));stroke:var(--surface);stroke-width:2}
.ft{fill:var(--ink);font-size:10px;font-weight:700;text-anchor:middle}
.dot{fill:var(--surface);stroke:var(--p);stroke-width:2.5}
.undo{fill:none;stroke:var(--no);stroke-width:1.5;stroke-dasharray:4 4}
</style><defs><symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol><symbol id="bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v1M15 13v1"/></symbol><symbol id="phone" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol><symbol id="shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol><symbol id="sheet" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></symbol><symbol id="pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></symbol><symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></symbol><symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol><symbol id="key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></symbol><symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol><symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd" d="M0 0L10 5L0 10z"/></marker></defs><rect class="node" x="0" y="60" width="150" height="110" rx="12"/><circle class="icbg" cx="30" cy="90" r="15"/><use class="ic " href="#pen" x="21.75" y="81.75" width="16.5" height="16.5"/><text class="t" x="54" y="95">A change</text><text class="s" x="16" y="128">someone asks to</text><text class="s" x="16" y="146">book Oak at 3 pm</text><path class="ln" d="M150 115H183" marker-end="url(#hd)"/><rect class="node" x="185" y="60" width="150" height="110" rx="12"/><circle class="icbg" cx="215" cy="90" r="15"/><use class="ic " href="#copy" x="206.75" y="81.75" width="16.5" height="16.5"/><text class="t" x="239" y="95">On a copy</text><text class="s" x="201" y="128">your real data</text><text class="s" x="201" y="146">isn't touched yet</text><path class="ln" d="M335 115H368" marker-end="url(#hd)"/><rect class="node" x="370" y="60" width="150" height="110" rx="12"/><circle class="icbg" cx="400" cy="90" r="15"/><use class="ic " href="#shield" x="391.75" y="81.75" width="16.5" height="16.5"/><text class="t" x="424" y="95">Checked</text><text class="s" x="386" y="128">every rule,</text><text class="s" x="386" y="146">every time</text><path class="ln" d="M520 115H534V50H548" marker-end="url(#hd)"/><path class="ln" d="M534 115V180H548" marker-end="url(#hd)"/><rect class="okn" x="550" y="0" width="170" height="100" rx="12"/><circle class="okb" cx="580" cy="30" r="15"/><use class="ic okc" href="#check" x="571.75" y="21.75" width="16.5" height="16.5"/><text class="t" x="604" y="35">Kept</text><text class="s" x="566" y="68">saved in the history,</text><text class="s" x="566" y="86">with who and why</text><rect class="non" x="550" y="130" width="170" height="100" rx="12"/><circle class="nob" cx="580" cy="160" r="15"/><use class="ic noc" href="#x" x="571.75" y="151.75" width="16.5" height="16.5"/><text class="t" x="604" y="165">Refused</text><text class="s" x="566" y="198">nothing changes,</text><text class="s" x="566" y="216">and you see why</text></svg>
