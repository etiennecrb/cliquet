# Run the executor against a real Docker, on Linux: build the sandbox image, run an app in a
# container, take a picture, and check that the app reaches no network. Docker Desktop on macOS
# can't pass a container's socket to a program on the host, so the test can't run there.
# Only by hand, from the Actions tab: the image takes minutes to build. Run it after changing
# the executor, the sandbox image or the SDK's packaging.
name: Real Docker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-docker
  cancel-in-progress: false

jobs:
  real-docker:
    name: Executor on a real Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLIQUET_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Build the sandbox image
        run: docker build -f docker/sandbox.Dockerfile -t cliquet-sandbox:latest .
      - name: Run the real-Docker test
        run: uv run pytest packages/server/tests/test_server_docker.py -k real -s -n 0 -p no:cacheprovider
